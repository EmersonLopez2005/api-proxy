services:
  api-proxy:
    image: nginx:1.27-alpine
    container_name: api-proxy
    restart: unless-stopped

    ports:
      # 宿主机端口由 .env 里的 HTTP_PORT 控制（默认 80）；容器内部固定监听 80
      - "${HTTP_PORT:-80}:80"

    volumes:
      # nginx/nginx.conf 由 setup.sh 从模板 + sites.conf 生成，已被 gitignore
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    environment:
      - TZ=Asia/Shanghai

    # 健康检查走容器内的 8081，不占用对外端口
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # 日志只在宿主机留 3 个 10MB 文件，避免磁盘被写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 生产建议打开，防止容器被 OOM 牵连宿主机
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
